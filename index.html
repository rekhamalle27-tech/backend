<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" 
content="
default-src 'self';
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
font-src https://fonts.gstatic.com;
script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.tailwindcss.com;
connect-src 'self' http://localhost:5000;
img-src 'self' https://images.unsplash.com;
frame-src https://www.youtube.com https://www.youtube-nocookie.com;
">

    <title>EduFlow | Master Technical Skills</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  
</head>
<body class="bg-[#f8fafc] text-slate-900 font-sans min-h-screen flex flex-col">
    <!-- Navigation -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2 cursor-pointer" onclick="router.navigate('/')">
                    <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-200">
                        <i data-lucide="graduation-cap"></i>
                    </div>
                    <span class="text-xl font-bold tracking-tight font-outfit text-indigo-900">EduFlow</span>
                </div>
                
                <div class="hidden md:flex items-center space-x-8">
                    <a href="/" class="nav-link active" data-link>Home</a>
                    <a href="/subjects" class="nav-link" data-link>Subjects</a>
                    <a href="/dashboard" class="nav-link" data-link>Dashboard</a>
                </div>

                <div id="auth-nav" class="flex items-center gap-4">
                    <!-- Auth state will be injected here -->
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app" class="grow">
        <!-- Views will be injected here -->
        <div class="flex items-center justify-center h-96">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-12 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-slate-500 text-sm">© 2026 EduFlow Learning Platform. Built for the next generation of engineers.</p>
        </div>
    </footer>
<i data-lucide="book"></i>
<i data-lucide="cpu"></i>
<i data-lucide="shield"></i>

    <!-- App Scripts -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>
